<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Writer Suggestion</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html, body { margin: 0; background: var(--card); overflow: hidden; }
  .scard { box-sizing: border-box; border: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; user-select: none; min-height: 100vh; }
  .scard .kind { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grammar); flex: none; }
  .k-spelling .dot { background: var(--spelling); } .k-style .dot { background: var(--style); }
  .k-clarity .dot { background: var(--clarity); } .k-sentence .dot { background: #e0b020; } .k-synonyms .dot { background: var(--accent); }
  .scard .msg { margin: 0; font-size: 14px; line-height: 1.4; }
  .orig { text-decoration: line-through; color: var(--spelling); margin-right: 4px; }
  .reps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rep { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 7px; padding: 5px 12px; font-weight: 600; cursor: pointer; }
  .syn { background: var(--bg); color: var(--text); border-color: var(--border); font-weight: 500; }
  .syn:hover { border-color: var(--accent); }
  .rw { background: color-mix(in srgb, #2e9e4a 10%, transparent); border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
  .rw button { align-self: flex-start; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .foot span { display: flex; gap: 12px; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; cursor: pointer; }
  .errors { color: var(--spelling); font-size: 13px; margin: 0; }
</style>
</head>
<body>
  <div id="card" class="scard"></div>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const api = () => window.pywebview && window.pywebview.api;
  const appName = (exe) => (exe || "this app").replace(/\.exe$/i, "");
  // grow/shrink the window to fit the content
  const fit = () => requestAnimationFrame(() => { const h = $("#card").scrollHeight; if (api()) api().fit(h); });
  let cur = null;

  window.showIssue = (p) => {
    cur = p;
    $("#card").className = "scard k-" + p.kind;
    $("#card").innerHTML = `
      <div class="kind"><span class="dot"></span><span>${esc(p.label)} · ${esc(p.source)}</span></div>
      <p class="msg">${esc(p.message)}</p>
      ${p.original || p.replacements.length ? `<div class="reps">${p.original ? `<span class="orig">${esc(p.original)}</span>` : ""}${
        p.replacements.map((r, i) => `<button class="rep" data-i="${i}">${esc(r) || "(remove)"}</button>`).join("")}</div>` : ""}
      <div id="rw"></div>
      <div class="foot"><span>
        ${p.canRewrite ? '<button class="link" id="rewrite">Rewrite sentence</button>' : ""}
        ${p.canAddWord ? '<button class="link" id="addword">Add to dictionary</button>' : ""}
        <button class="link" id="ignore">Ignore</button></span>
        <button class="link" id="off">Turn off in ${esc(appName(p.exe))}</button></div>`;
    fit();
  };
  window.showRewrite = (r) => {
    $("#rw").innerHTML = r.error ? `<p class="errors">${esc(r.error)}</p>`
      : `<div class="rw"><div>${esc(r.text)}</div><button class="rep" id="use-rw">Use this</button></div>`;
    fit();
  };
  window.showSynonyms = (r) => {
    $("#syns").innerHTML = r.error ? `<p class="errors">${esc(r.error)}</p>`
      : (r.synonyms.map((w, i) => `<button class="rep syn" data-i="${i}">${esc(w)}</button>`).join("") || '<span class="muted small">No synonyms found</span>');
    fit();
  };
  window.showSynonymsLoading = (p) => {
    cur = p;
    $("#card").className = "scard k-synonyms";
    $("#card").innerHTML = `<div class="kind"><span class="dot"></span><span>Synonyms for <b>${esc(p.word)}</b></span></div>
      <div id="syns" class="reps"><span class="muted small">Thinking…</span></div>
      <div class="foot"><span></span><button class="link" id="off">Turn off in ${esc(appName(p.exe))}</button></div>`;
    fit();
  };

  document.addEventListener("click", (e) => {
    const a = api(); if (!a) return;
    const b = e.target.closest(".rep[data-i]");
    if (b) return a.apply(+b.dataset.i);
    const id = e.target.id;
    if (id === "use-rw") return a.use_rewrite();
    if (id === "rewrite") { $("#rw").innerHTML = '<div class="rw muted small">Rewriting…</div>'; fit(); return a.rewrite(); }
    if (id === "addword") return a.add_word();
    if (id === "ignore") return a.ignore();
    if (id === "off") return a.disable_app();
  });
</script>
</body>
</html>
